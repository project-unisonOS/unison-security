name: publish-policy-bundle

on:
  push:
    tags:
      - "policy-*"

permissions:
  contents: write
  id-token: write

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Build policy bundle
        uses: project-unisonOS/.github/.github/workflows/reusable-policy-bundle.yml@955fd5c8924b1c2b1324453416afc8b6911ff235
        with:
          policy-dir: policies
          bundle-out: bundle.tar.gz

      - name: Download bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle.tar.gz
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign bundle (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes dist/bundle.tar.gz > dist/bundle.sig

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/bundle.tar.gz
            dist/bundle.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
