agent {
  data_dir = "/run/spire"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  trust_bundle_path = "/run/spire/config/bootstrap.crt"
  trust_domain = "unisonos.test"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  WorkloadAttestor "unix" {
    plugin_data {}
  }

  KeyManager "disk" {
    plugin_data {
      directory = "/run/spire/keys"
    }
  }
}
