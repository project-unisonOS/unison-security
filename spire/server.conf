server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "unisonos.test"
  data_dir = "/run/spire/data"
  log_level = "INFO"

  ca_key_type = "ed25519"

  upstream_bundle = false

  default_svid_ttl = "720h"
  ca_subject = {
    country = ["US"],
    organization = ["UnisonOS"],
    common_name = "spire-server"
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }

  KeyManager "disk" {
    plugin_data {
      directory = "/run/spire/keys"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }
}
